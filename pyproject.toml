[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ovos-ww-verifier-plugin-speaker"
dynamic = ["version"]
description = "OVOS wake word verifier plugin: reject wake words from non-enrolled speakers"
license = {text = "Apache-2.0"}
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
]
authors = [{name = "JarbasAI", email = "jarbasai@mailfence.com"}]
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "speakeronnx",
    "ovos-plugin-manager",
]

[project.optional-dependencies]
test = [
    "pytest",
    # bus-sequence e2e: drive the verifier through a real DinkumVoiceLoop.
    # Pinned to the alpha whose _detect_ww consults the verifier chain (the
    # hotword-verifier gate) — the suppression tests are meaningless without it,
    # so this is a hard requirement rather than a best-effort skip.
    "ovoscope>=0.19.0a1",
    "ovos-dinkum-listener>=0.6.0a1",
    # model2vec arrives through ovos-m2v-pipeline, which asks for
    # model2vec[inference]. That extra was removed in model2vec 0.9.0, so the
    # resolver backtracks looking for a release that still has it and lands on
    # 0.2.4, which drags transformers 2.3.0 (2019) and tokenizers 0.13.3.
    # tokenizers 0.13.3 has no 3.12 wheel, so the job tried to build it from
    # Rust source and failed. This floor keeps the resolver on a modern
    # model2vec, where tokenizers is 0.23.2 and ships a cp310-abi3 wheel.
    # ovos-m2v-pipeline also declares scikit-learn and skops directly, so the
    # missing extra costs nothing. The extra itself is the upstream defect.
    "model2vec>=0.8.2",
]
# Audio fixtures are committed (tests/fixtures/); regenerate them locally with
# `python tests/generate_fixtures.py`, which needs edge-tts + ffmpeg. These are
# deliberately NOT in `test` so CI never synthesises audio.

[project.scripts]
ovos-speaker-enroll = "ovos_ww_verifier_plugin_speaker.__main__:main"

[project.entry-points."opm.wake_word.verifier"]
ovos-ww-verifier-speaker = "ovos_ww_verifier_plugin_speaker:SpeakerVerifier"

[project.urls]
Homepage = "https://github.com/TigreGotico/ovos-ww-verifier-plugin-speaker"

[tool.setuptools.dynamic]
version = {attr = "ovos_ww_verifier_plugin_speaker.version.__version__"}

[tool.setuptools.packages.find]
where = ["."]

[tool.setuptools.package-data]
"ovos_ww_verifier_plugin_speaker" = ["**/*"]

[tool.mypy]
python_version = "3.9"
ignore_missing_imports = true
strict = false
warn_unused_ignores = true
warn_return_any = false
